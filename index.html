<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Life — задачи, календарь, цели, привычки и аналитика в одном месте. Работает офлайн и устанавливается на iPhone." />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA / iOS -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Life" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <title>Life — планировщик жизни</title>
    <style>
      html, body, #root { min-height: 100%; }
      html { background: #f2f2f7; }
      @media (prefers-color-scheme: dark) { html { background: #0b0b0e; } }
      html[data-theme="dark"], html[data-theme="black"] { background: #0b0b0e; }
      html[data-theme="light"] { background: #f2f2f7; }
      body { margin: 0; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: inherit; color: #0a84ff; font-size: 42px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }
      #root:not(:empty) + #boot { display: none; }
    </style>
    <script>
      try {
        var c = JSON.parse(localStorage.getItem("life.theme") || "{}");
        var r = document.documentElement;
        var t = c.theme || "auto";
        var dark = t === "dark" || t === "black" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.theme = t === "black" ? "black" : dark ? "dark" : "light";
        if (c.accent) r.style.setProperty("--accent", c.accent);
        if (c.fontScale) r.style.setProperty("--fs", c.fontScale);
        r.dataset.radius = c.radius || "normal";
        r.dataset.density = c.density || "cozy";
        r.dataset.bg = c.background || "aurora";
        r.dataset.motion = c.motion || "full";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">✦</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
